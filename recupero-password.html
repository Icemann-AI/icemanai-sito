<span class="eti">Area clienti</span>
<h1>Recupero password</h1>
<div class="vetro">
<form id="form-recupero" class="form-clienti">
<label for="email">Email dell'account</label>
<input id="email" name="email" type="email" required autocomplete="email">
<button class="btn pri" type="submit">Invia link</button>
<p class="esito"></p>
</form>
<form id="form-reset" class="form-clienti" hidden>
<input type="hidden" name="token" value="">
<label for="np">Nuova password</label>
<input id="np" name="password" type="password" required minlength="8" autocomplete="new-password">
<label for="np2">Ripeti password</label>
<input id="np2" name="password2" type="password" required minlength="8" autocomplete="new-password">
<button class="btn pri" type="submit">Salva nuova password</button>
<p class="esito"></p>
</form>
